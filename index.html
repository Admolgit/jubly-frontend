<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jubly</title>
    <script>
      (function () {
        // Keep in sync with src/theme/ThemeContext.tsx: light is the default,
        // OS/browser preference is intentionally ignored, only an explicit
        // stored choice switches to dark. Runs before paint to avoid a flash.
        try {
          var stored = localStorage.getItem("jubly-theme");
          var theme = stored === "dark" ? "dark" : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
