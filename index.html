<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Discover and book trusted makeup artists, salons, spas, bakers and local service professionals with Jubly."
    />

    <link rel="canonical" href="https://jubly.com.ng/" />
    <link rel="icon" type="image/" href="src/assets/jubly-logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Jubly - Book Trusted Local Services in Nigeria</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jubly-theme');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          console.log(e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
